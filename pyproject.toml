[build-system]
build-backend = "uv_build"

requires = [
  "uv-build>=0.8,<0.9",
]

[project]
name = "matmek4270-mandatory1"
version = "1.0.0"
description = "Mandatory assignment 1 for MAT-MEK4270 course - Computational methods in mechanics"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Mikael Mortensen"}
]
keywords = ["numerical-methods", "mechanics", "computational-mathematics", "finite-difference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "sympy>=1.14",
    "scipy>=1.17.1",
    "pytest-xdist[psutil]>=3.8",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9.3",
    "ipython>=8.0",
    "black>=23.0",
    "isort>=5.0",
    "ty>=0.0.64",
]

[project.urls]
Homepage = "https://www.uio.no/studier/emner/matnat/math/MAT-MEK4270/"
Repository = "https://github.com/MATMEK-4270/mandatory1"

[tool.uv.build-backend]
module-name = "mandatory1"
module-root = ""
namespace = true

[tool.pytest.ini_options]
testpaths = ["."]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
